    <g font-family="Arial, sans-serif"><text x="48" y="65" fill="#57d7e6" font-size="17" text-anchor="start" font-weight="700">01 / ENTERPRISE AI</text><text x="48" y="115" fill="#e8f0f7" font-size="34" text-anchor="start" font-weight="700">From request to execution.</text><path d="M400 238L400 281" stroke="#438795" stroke-width="1.5" fill="none"/><path d="M400 370L400 415" stroke="#438795" stroke-width="1.5" fill="none"/><rect x="145" y="166" width="510" height="72" rx="12" fill="#101f31" stroke="#365468"/><text x="400.0" y="208.0" fill="#e8f0f7" font-size="20" text-anchor="middle" font-weight="600">Search · Analysis · Presentations</text><rect x="145" y="281" width="510" height="89" rx="12" fill="#101f31" stroke="#57d7e6"/><text x="400.0" y="322.5" fill="#e8f0f7" font-size="20" text-anchor="middle" font-weight="600">Route, reason, and act</text><text x="400.0" y="346.5" fill="#9fb0c2" font-size="13" text-anchor="middle" font-weight="400">Reusable agents + shared MCP tools</text><rect x="75" y="415" width="310" height="82" rx="12" fill="#101f31" stroke="#365468"/><text x="230.0" y="453.0" fill="#e8f0f7" font-size="20" text-anchor="middle" font-weight="600">Event-driven execution</text><text x="230.0" y="477.0" fill="#9fb0c2" font-size="13" text-anchor="middle" font-weight="400">Couchbase + Go</text><rect x="415" y="415" width="310" height="82" rx="12" fill="#101f31" stroke="#365468"/><text x="570.0" y="453.0" fill="#e8f0f7" font-size="20" text-anchor="middle" font-weight="600">Governed access</text><text x="570.0" y="477.0" fill="#9fb0c2" font-size="13" text-anchor="middle" font-weight="400">LDAP + entitlements</text><path d="M48 543H752" stroke="#365468"/><text x="48" y="587" fill="#57d7e6" font-size="25" text-anchor="start" font-weight="600">Built for reuse.</text><text x="48" y="613" fill="#9fb0c2" font-size="16" text-anchor="start" font-weight="400">Tracing, evaluation, and cost visibility across the workflow.</text></g></svg>